name: Release NuGet

# Vydání = git tag v1.2.3 && git push origin v1.2.3
# Předběžná verze = v1.2.3-beta.1 (GitHub Release se označí jako prerelease).
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Verze bez "v" (např. 1.2.3). Pro ruční dopublikování.'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # Musí odpovídat poli Environment v trusted publishing politice na nuget.org.
    environment: nuget
    permissions:
      contents: write   # gh release create
      id-token: write   # OIDC token pro výměnu za dočasný NuGet API klíč

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Odvození verze
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Neplatná verze '$VERSION'. Očekává se semver, např. 1.2.3 nebo 1.2.3-beta.1."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Verze: $VERSION"

      # -p:Version je globální property, propíše se i do závislosti
      # GitHttpBackend.AspNetCore -> GitHttpBackend, takže obě verze jdou v lockstepu.
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for proj in src/GitHttpBackend/GitHttpBackend.csproj \
                      src/GitHttpBackend.AspNetCore/GitHttpBackend.AspNetCore.csproj; do
            dotnet pack "$proj" \
              --configuration Release \
              -p:Version="$VERSION" \
              -p:ContinuousIntegrationBuild=true \
              --output artifacts
          done
          ls -l artifacts

      # Trusted publishing: OIDC token -> dočasný API klíč platný 1 hodinu.
      # Žádá se až těsně před pushem, jeden token lze vyměnit jen jednou.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}   # profilové jméno na nuget.org, ne e-mail

      # Odpovídající .snupkg se pushne automaticky spolu s .nupkg ze stejné složky.
      - name: Push na nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" artifacts/*.nupkg --generate-notes $FLAGS
